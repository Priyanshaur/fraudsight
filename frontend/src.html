<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FraudSight — Financial Crime Investigation Platform</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f2; --txt:#0f1e3d; --body:#3d4b66; --mut:#7b87a1;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-bg:#eff4ff;
  --red:#dc2626; --red-bg:#fdecec; --orange:#ea7c28; --orange-bg:#fdf3e7;
  --green:#16a34a; --green-bg:#e9f7ee; --purple:#7c3aed; --purple-bg:#f1eafe;
  --gray-bg:#eef1f6;
  --r:10px; --sh:0 1px 2px rgba(16,30,61,.06);
  --sans:Inter,Geist,'SF Pro Text',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px}
a{color:var(--blue);text-decoration:none}
/* shell */
.shell{display:flex;min-height:100vh}
aside.side{width:232px;flex:0 0 232px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:9px;align-items:center;padding:18px 18px 14px;font-weight:800;font-size:17px}
.brand .mk{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
nav.menu{padding:4px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
nav.menu a{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--body);font-size:13.5px;font-weight:500}
nav.menu a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 17px}
nav.menu a:hover{background:var(--gray-bg)}
nav.menu a.on{background:var(--blue-bg);color:var(--blue);font-weight:700}
.sys{margin:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12px}
.sys .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.sys small{color:var(--mut)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:12px 26px;backdrop-filter:blur(6px)}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 34px;font-size:13.5px;font-family:var(--sans)}
.search .ic{position:absolute;left:11px;top:10px;color:var(--mut)}
.sdrop{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,30,61,.12);display:none;max-height:320px;overflow:auto;z-index:40}
.sdrop .r{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sdrop .r:hover{background:var(--blue-bg)}
.topright{margin-left:auto;display:flex;gap:14px;align-items:center}
.bell{position:relative;cursor:pointer;color:var(--body)}
.bell .n{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px}
.user{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ndrop{position:absolute;top:56px;right:20px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,30,61,.12);width:320px;display:none;z-index:40;max-height:380px;overflow:auto}
.ndrop .r{padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.ndrop .r:hover{background:var(--blue-bg)}
.page{padding:26px 28px 60px;max-width:1240px}
h1.p{font-size:26px;margin:0}
.sub{color:var(--body);margin:4px 0 0;font-size:14px}
.phead{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.phead .sp{flex:1}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--mut);font-size:12.5px;margin:0 0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.kpi{display:flex;gap:13px;align-items:flex-start}
.kpi .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 42px;font-size:18px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1}
.kpi .t{font-size:13px;color:var(--body);font-weight:600}
.kpi .d{font-size:12px;margin-top:3px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--mut)}
/* badges */
.bdg{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-Critical,.b-High{background:var(--red-bg);color:var(--red)}
.b-Medium{background:var(--orange-bg);color:#b45309}
.b-Low{background:var(--green-bg);color:var(--green)}
.b-Info{background:var(--gray-bg);color:var(--body)}
.b-New,.b-Open{background:var(--blue-bg);color:var(--blue)}
.b-UnderReview,.b-InProgress{background:var(--orange-bg);color:#b45309}
.b-Escalated{background:var(--purple-bg);color:var(--purple)}
.b-Cleared,.b-Resolved{background:var(--green-bg);color:var(--green)}
.b-FP{background:var(--gray-bg);color:#5b6478}
.det{font-size:11px;font-family:var(--mono);background:var(--gray-bg);border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:1px 3px 1px 0;display:inline-block;color:var(--body)}
.det.conf-medium{opacity:.7;border-style:dashed}.det.conf-low{opacity:.5;border-style:dotted}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr.rowlink{cursor:pointer}
table.t tbody tr.rowlink:hover{background:#f8faff}
.mono{font-family:var(--mono);font-size:12.5px}
/* buttons */
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.btn:hover{background:#f6f8fc}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#f3c2c2}
.btn:disabled{opacity:.55;cursor:wait}
select,input[type=text],input[type=number],textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;font-family:var(--sans);color:var(--txt)}
label.fl{font-size:12px;color:var(--body);font-weight:600;display:block;margin:10px 0 4px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;font-size:13.5px;color:var(--body);cursor:pointer;font-weight:600}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
/* evidence graph */
#egraph{height:460px;background:#fbfcff;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
.gtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gtools .btn{padding:5px 10px;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--body);margin:10px 0 0}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.legend .bx{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.legend .ln{width:20px;height:0;display:inline-block;margin-right:4px;vertical-align:3px}
.tl{font-size:13px;line-height:1.8}
.tl .ts{font-family:var(--mono);color:var(--mut);font-size:12px}
.narr{background:#f6f9ff;border:1px solid #d7e3fa;border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;font-size:13.5px}
.facts{margin:8px 0;padding-left:20px}
.facts li{margin:5px 0}
.tag{font-size:11.5px;background:var(--gray-bg);border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0;display:inline-block;color:var(--body)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.chip{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 12px;margin:3px 5px 3px 0;cursor:pointer;display:inline-block;color:var(--body)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.sent{border-bottom:1px solid var(--line);padding:8px 2px;font-size:13.5px}
.stage{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.stage:last-child{border-bottom:none}
.st-ic{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.st-ok{background:var(--green-bg);color:var(--green)}.st-run{background:var(--blue-bg);color:var(--blue)}.st-wait{background:var(--gray-bg);color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f1e3d;color:#fff;border-radius:8px;padding:10px 18px;display:none;z-index:60;font-size:13.5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #c6d4f5;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center;background:#fff}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--body)}
.pager button{min-width:30px}
.filters label.fl{margin-top:12px}
.note{font-size:12.5px;color:var(--mut)}
svg.chart text{font-family:var(--sans)}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}.grid2,.cols2{grid-template-columns:1fr}aside.side{display:none}}

/* ---- polish pass: motion, depth, life ---- */
.card{transition:transform .16s ease,box-shadow .16s ease}
a.card:hover,div.acard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,30,61,.10)}
table.t tbody tr{transition:background .12s ease}
.btn{transition:background .12s ease,transform .08s ease}
.btn:active{transform:scale(.97)}
.bdg{letter-spacing:.02em}
.page{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.skel{border-radius:8px;background:linear-gradient(90deg,#e8edf6 25%,#f4f6fb 50%,#e8edf6 75%);background-size:200% 100%;animation:shim 1.1s linear infinite;color:transparent!important;border:none!important;pointer-events:none}
@keyframes shim{to{background-position:-200% 0}}
.kpi .v{font-variant-numeric:tabular-nums}
.spark{margin-top:6px}
.replay-cap{background:#0f1e3d;color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;margin-top:10px;min-height:44px}
.replay-cap b{color:#9fc0ff}
.rt-step-on{outline:2px solid var(--blue)}
.pulse{animation:pl 1.2s ease-out 2}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}100%{box-shadow:0 0 0 14px rgba(37,99,235,0)}}
.stage-new{animation:fadein .3s ease}
.jargon{border-bottom:1px dotted #2563eb;cursor:help}#gloss{position:fixed;z-index:60;max-width:300px;background:#0f1e3d;color:#fff;border-radius:8px;padding:9px 13px;font-size:13px;line-height:1.5;display:none;box-shadow:0 8px 26px rgba(0,0,0,.3)}.story{border:1px solid #f0d48a;background:#fffdf4;border-left:4px solid #eab308;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.65;margin-bottom:12px}.hl-btn.on{background:#2563eb;color:#fff;border-color:#2563eb}@media print{aside.side,header.top,.noprint{display:none}.page{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><span class="mk">◈</span> FraudSight</div>
  <nav class="menu" id="menu"></nav>
  <div class="sys"><span class="dot"></span><b>System Online</b><br><small id="sysUpd">Last updated: —</small></div>
</aside>
<div class="main">
<header class="top">
  <div class="search"><span class="ic">⌕</span><input id="gq" placeholder="Search by entity, account, transaction or alert..." autocomplete="off"><div class="sdrop" id="sdrop"></div></div>
  <div class="topright">
    <span class="bell" id="bell">🔔<span class="n" id="bellN">0</span></span>
    <span class="user"><span class="avatar">JD</span> John Doe</span>
  </div>
  <div class="ndrop" id="ndrop"></div>
</header>
<div class="page" id="view"></div>
</div>
</div>
<div id="toast"></div>
<script>/*__VIS_LIB_INLINE__*/</script>
<script>
"use strict";
/* ================= core ================= */
const $=s=>document.querySelector(s);
async function api(u,o){let r;try{r=await fetch(u,o);}catch(e){toast('Network error — is the backend running?');throw e;}
  if(!r.ok){toast('Request failed ('+r.status+')');throw new Error(r.status);}return r.json();}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const inrCr=n=>n>=1e7?'₹'+(n/1e7).toFixed(1)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1)+' L':inr(n);
const inrL=n=>n>=100000?'₹'+(n/100000).toFixed(1)+'L':inr(n);
const RISK_RANK={Critical:4,High:3,Medium:2,Low:1};
const STATUSMAP={'New':'Open','Under Review':'In Progress','Escalated':'Open','Cleared':'Resolved'};
const DLABEL={circular:'Circular Transfer',structuring:'Structuring',access_anomaly:'Access Anomaly',hub_shift:'Hub Shift'};
const state={alerts:[],entities:null,metrics:null,details:{},route:'home',param:null,
  invTab:'All',invQ:'',invF:{type:'',status:'',risk:''},expFilters:{types:{employee:1,account:1,transaction:1},q:''}};
function bdgRisk(r){return '<span class="bdg b-'+r+'">'+r+'</span>';}
function bdgStatus(s){const m=STATUSMAP[s]||s;const cls=s==='New'?'New':s==='Under Review'?'UnderReview':s==='Escalated'?'Escalated':'Cleared';
  return '<span class="bdg b-'+cls+'">'+m+'</span>';}
function detPills(a){const c=a.det_conf||{};return (a.detectors||[]).map(d=>{const k=c[d]||'high';const t=DLABEL[d]||d;
  return '<span class="det">'+(k==='high'?'':' conf-'+k)+' title="'+esc(t)+' - confidence: '+k+'>'+gterm(d,t)+'</span>';}).join('');}
function alertTime(a){const tl=(a.evidence&&a.evidence.timeline)||[];return tl.length?tl[0].ts.slice(0,16).replace('T',', '):'—';}
function alertAmount(a){return Math.max(0,...(a.hits||[]).map(h=>h.total_amount||0));}
function primaryEntity(a){const h=(a.hits||[])[0]||{};
  if(h.type==='access_anomaly')return h.emp+' → '+h.account;
  if(h.type==='structuring')return h.src+' → '+h.dst;
  if(h.type==='hub_shift')return h.account+' → '+h.fanout+' accts';
  if(h.type==='circular'&&h.cycle)return h.cycle[0]+' → '+h.cycle[1];
  return (a.tx_ids||[]).length+' tx';}
function fmtDate(ts){try{const d=new Date(ts);return d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return ts;}}
function detDate(a){const d=state.details[a.id];const tl=d&&d.evidence&&d.evidence.timeline;return tl&&tl.length?tl[0].ts:'';}
/* ---- data loading ---- */
async function ensureBase(){
  if(!state.metrics)state.metrics=await api('/api/metrics');
  if(!state.alerts.length)state.alerts=await api('/api/alerts');
  if(!state.entities)state.entities=await api('/api/entities');
  if(!state.emps)state.emps=await api('/api/employees');
}
async function detail(id){
  if(!state.details[id])state.details[id]=await api('/api/alerts/'+id);
  return state.details[id];
}
async function allDetails(){
  await ensureBase();
  await Promise.all(state.alerts.map(a=>detail(a.id)));
  return state.alerts.map(a=>state.details[a.id]);
}
/* ---- svg charts (no libraries, offline-safe) ---- */
function lineChart(series,labels,W,H){
W=W||560;H=H||210;const P={l:32,r:10,t:12,b:26},iw=W-P.l-P.r,ih=H-P.t-P.b;
const max=Math.max(1,...series.flatMap(s=>s.values));
const X=i=>P.l+iw*(labels.length<=1?0.5:i/(labels.length-1));
const Y=v=>P.t+ih*(1-v/max);
let g='';
for(let k=0;k<=4;k++){const y=P.t+ih*k/4,v=Math.round(max*(1-k/4));
g+='<line x1='+P.l+' y1='+y+' x2='+(W-P.r)+' y2='+y+' stroke=#edf1f8/>';}
let paths='';
series.forEach((s,si)=>{const pts=s.values.map((v,i)=>[X(i),Y(v)]);
const dl=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const gid='ag'+si;
paths+='<defs><linearGradient id='+gid+' x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color='+s.color+' stop-opacity=.25/><stop offset=1 stop-color='+s.color+' stop-opacity=0/></linearGradient></defs>';
if(si===0)paths+='<path d='+dl+'L'+X(s.values.length-1).toFixed(1)+' '+(P.t+ih)+'L'+X(0).toFixed(1)+' '+(P.t+ih)+'Z fill=url(#'+gid+')/>';
paths+='<path d='+dl+' fill=none stroke='+s.color+' stroke-width=2.5 stroke-linecap=round/>';
pts.forEach((pt,i)=>{paths+='<circle cx='+pt[0].toFixed(1)+' cy='+pt[1].toFixed(1)+' r=3.4 fill=#fff stroke='+s.color+' stroke-width=2><title>'+s.name+': '+labels[i]+' - '+s.values[i]+'</title></circle>';});});
const xl=labels.map((l,i)=>'<text x='+X(i).toFixed(1)+' y='+(H-8)+' font-size=10 fill=#7b87a1 text-anchor=middle>'+esc(l)+'</text>').join('');
const leg=series.map(s=>'<span style=margin-right:12px;font-size:12px;color:#3d4b66><span style=display:inline-block;width:8px;height:8px;border-radius:50%;background:'+s.color+';margin-right:4px></span>'+esc(s.name)+'</span>').join('');
return '<div style=margin-bottom:6px>'+leg+'</div><svg width=100% viewBox=0 0 '+W+' '+H+'>'+g+paths+xl+'</svg>';
}
function spark(vals,color){
const W=110,H=30,max=Math.max(1,...vals);
const p=vals.map((v,i)=>(i?'L':'M')+(i/(Math.max(1,vals.length-1))*W).toFixed(1)+' '+(H-3-(v/max)*(H-8)).toFixed(1)).join(' ');
return '<svg width='+W+' height='+H+'><path d='+p+' fill=none stroke='+color+' stroke-width=2/></svg>';
}function donut(segs,size){
  size=size||170;const R=60,C=2*Math.PI*R;let off=0,arcs='';
  segs.forEach(s=>{const len=C*s.frac;
    arcs+='<circle cx="85" cy="85" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="22" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 85 85)"/>';
    off+=len;});
  const rows=segs.map(s=>'<div style="display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0"><span style="width:9px;height:9px;border-radius:50%;background:'+s.color+'"></span><span style="flex:1">'+esc(s.name)+'</span><b>'+Math.round(s.frac*100)+'%</b></div>').join('');
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="position:relative;width:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 170 170">'+arcs+'</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:22px">'+segs.reduce((t,s)=>t+s.n,0)+'</b><small style="color:#7b87a1">Total Alerts</small></div></div><div style="flex:1;min-width:150px">'+rows+'</div></div>';
}
function hbars(rows){

function cycleLayoutPositions(cycle,txEdges,W,H){
  const n=cycle.length,R=Math.min(W,H)*0.32,cx=0,cy=-10,pos={};
  cycle.forEach((id,k)=>{const ang=-Math.PI/2+k*2*Math.PI/n;pos[id]={x:cx+R*Math.cos(ang),y:cy+R*Math.sin(ang)};});
  (txEdges||[]).forEach(te=>{const A=pos[te.src],B=pos[te.dst];if(!A||!B)return;
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,d=Math.hypot(mx-cx,my-cy)||1;
    pos[te.tx]={x:mx+(mx-cx)/d*46,y:my+(my-cy)/d*46};});
  return pos;
}
function evGraph(el,ev,a,opts){
  opts=opts||{};el.innerHTML='';
  if(typeof vis==='undefined'){el.innerHTML='<div class="empty">Graph library failed to load.</div>';return null;}
  const nodes=ev.nodes||[],edges=ev.edges||[],kindById={};
  nodes.forEach(n=>kindById[n.id]=n.kind);
  const chit=a.detectors.includes('circular')?(a.hits||[]).find(h=>h.type==='circular'):null;
  const pos={};
  if(chit&&chit.cycle){
    const sOf={},dOf={};
    edges.forEach(e=>{if(kindById[e.to]==='transaction')sOf[e.to]=e.from;if(kindById[e.from]==='transaction')dOf[e.from]=e.to;});
    const txE=Object.keys(sOf).filter(t=>dOf[t]).map(t=>({tx:t,src:sOf[t],dst:dOf[t]}));
    Object.assign(pos,cycleLayoutPositions(chit.cycle,txE,(el.getBoundingClientRect().width)||700,460));
    nodes.filter(n=>!pos[n.id]).forEach((n,i,r)=>{pos[n.id]={x:(i-(r.length-1)/2)*120,y:170};});
  }
  const COL={employee:['#ede9fe','#7c3aed'],account:['#dbeafe','#2563eb'],transaction:['#d1fae5','#059669']};
  const nodeData=nodes.map(n=>{const c=COL[n.kind]||['#eef1f6','#64748b'];
    const o={id:n.id,label:n.label||n.id,title:(n.title||n.id)+'\n('+n.kind+')',
      color:{background:c[0],border:c[1]},shape:n.kind==='transaction'?'box':'dot',
      font:{color:'#0f1e3d',size:12}};
    if(pos[n.id]){o.x=pos[n.id].x;o.y=pos[n.id].y;o.fixed={x:true,y:true};}return o;});
  const pc={};
  const edgeData=edges.map((e,i)=>{const k=e.from+'→'+e.to;pc[k]=(pc[k]||0)+1;const idx=pc[k]-1;
    const o={id:i,from:e.from,to:e.to,label:e.label||'',title:e.title||'',
      dashes:!!e.dashes,color:{color:e.color&&e.color!=='red'&&e.color!=='orange'?'#94a3b8':e.color||'#94a3b8'},
      font:{color:'#5b6478',size:10},arrows:'to'};
    if(idx>0)o.smooth={enabled:true,type:'curvedCW',roundness:0.25*idx};
    return o;});
  const net=new vis.Network(el,{nodes:new vis.DataSet(nodeData),edges:new vis.DataSet(edgeData)},
    {layout:chit&&chit.cycle?undefined:{hierarchical:{enabled:true,direction:'UD',sortMethod:'directed',levelSeparation:120,nodeSpacing:140}},physics:chit&&chit.cycle?{enabled:false}:{stabilization:{iterations:150}},
     interaction:{hover:true,tooltipDelay:60}});
  if(opts.focus){net.on('stabilizationIterationsDone',()=>net.fit());if(chit&&chit.cycle)net.fit();}
  else if(chit&&chit.cycle)net.fit();
  else net.once('stabilizationIterationsDone',()=>net.fit());
  net._nds=net.body.data.nodes;net._eds=net.body.data.edges;
  net._ncol={};net._nds.forEach(n=>{const c=n.color||{};net._ncol[n.id]={bg:c.background||'#eef1f6',bd:c.border||'#64748b'};});
  net._ecol={};net._eds.forEach(e=>{const c=e.color||{};net._ecol[e.id]=c.color||'#94a3b8';});
  return net;
}

let rtPlaying=false;
async function rtReplay(){
const a=window._lastRt;if(!a||rtPlaying)return;rtPlaying=true;
const btn=document.getElementById('replayBtn');if(btn)btn.disabled=true;
const cap=document.getElementById('rtCap');cap.style.display='block';
const ev=a.evidence,timeline=ev.timeline||[];
const seen=[];
const steps=timeline.map(t=>{const ids=(t.text.match(/[AET]-\d+/g)||[]).filter(id=>seen.indexOf(id)<0);ids.forEach(id=>seen.push(id));return {ts:t.ts,text:t.text,ids};});
const el=document.getElementById('egraph');
const kindById={};ev.nodes.forEach(n=>kindById[n.id]=n.kind);
const chit=a.detectors.indexOf('circular')>=0?(a.hits||[]).filter(h=>h.type==='circular')[0]:null;
const pos={};
if(chit&&chit.cycle){const sOf={},dOf={};
ev.edges.forEach(e=>{if(kindById[e.to]==='transaction')sOf[e.to]=e.from;if(kindById[e.from]==='transaction')dOf[e.from]=e.to;});
const txE=Object.keys(sOf).filter(t=>dOf[t]).map(t=>({tx:t,src:sOf[t],dst:dOf[t]}));
const W=(el.getBoundingClientRect().width)||700;
Object.assign(pos,cycleLayoutPositions(chit.cycle,txE,W,460));}
else{const order=[];steps.forEach(s=>s.ids.forEach(id=>{if(order.indexOf(id)<0)order.push(id);}));
order.forEach((id,i)=>{pos[id]={x:-320+i*110,y:(i%2?60:-60)};});}
const COL={employee:['#ede9fe','#7c3aed'],account:['#dbeafe','#2563eb'],transaction:['#d1fae5','#059669']};
const nds=new vis.DataSet(ev.nodes.map(n=>{const c=COL[n.kind]||['#eef1f6','#64748b'];
return {id:n.id,label:n.label||n.id,title:(n.title||n.id),color:{background:c[0],border:c[1]},shape:n.kind==='transaction'?'box':'dot',font:{color:'#0f1e3d',size:13},hidden:true,x:pos[n.id]?pos[n.id].x:undefined,y:pos[n.id]?pos[n.id].y:undefined};}));
const eds=new vis.DataSet(ev.edges.map((e,i)=>({id:i,from:e.from,to:e.to,label:e.label||'',title:e.title||'',dashes:!!e.dashes,color:{color:"#94a3b8"},font:{color:"#5b6478",size:10},arrows:'to',hidden:true})));
rtNet=new vis.Network(el,{nodes:nds,edges:eds},{physics:{enabled:false},interaction:{hover:true}});
rtNet.fit();
const shown={};
for(let k=0;k<steps.length;k++){const st=steps[k];
st.ids.forEach(id=>{if(nds.get(id)){nds.update({id:id,hidden:false});shown[id]=1;}});
eds.forEach(e=>{if(!e.hidden)return;if(shown[e.from]&&shown[e.to])eds.update({id:e.id,hidden:false});});
cap.innerHTML='<b>Step '+(k+1)+'/'+steps.length+'</b> - '+fmtDate(st.ts)+' — '+esc(st.text);
const bar=document.getElementById('rtBar');if(bar)bar.style.width=Math.round(100*(k+1)/steps.length)+'%';
await new Promise(r=>setTimeout(r,900));}
rtNet.fit();
cap.innerHTML='<b>Attack complete.</b> '+timeline.length+' events, every node real evidence from '+a.id+'.';
if(btn)btn.disabled=false;rtPlaying=false;
}

function expDataset(){

  const txs=E.transactions.filter(t=>!cut||(maxTs-new Date(t.ts).getTime())<=cut*864e5);
  return {txs,keep:new Set([...E.employees.map(e=>e.id),...E.accounts.map(a=>a.id),...txs.map(t=>t.id)])};
}
function expBuild(focusId){

  const showAcc=$('#xAcc')?$('#xAcc').checked:true;
  const {txs,keep}=expDataset();
  const E=state.entities,nodes=[],edges=[];
  E.employees.forEach(e=>{if(show.employee)nodes.push({id:e.id,label:e.id,title:e.id+' (employee)',kind:'employee'});});
  E.accounts.forEach(a=>{if(show.account)nodes.push({id:a.id,label:a.id,title:a.id+' (account)',kind:'account'});});
  txs.forEach(t=>{if(show.transaction)nodes.push({id:t.id,label:'₹'+Math.round(t.amount/1000)+'k',title:t.id+': '+t.src+'→'+t.dst+' ₹'+t.amount,kind:'transaction'});});

  txs.forEach(t=>{if(vis2.has(t.src)&&vis2.has(t.id)&&vis2.has(t.dst)){edges.push({from:t.src,to:t.id,color:'#94a3b8'});edges.push({from:t.id,to:t.dst,label:'₹'+Math.round(t.amount/1000)+'k',color:'#94a3b8'});}});

  if(v==='table'){
    $('#xTbl').innerHTML='<table class="t"><thead><tr><th>Type</th><th>ID</th><th>Detail</th></tr></thead><tbody>'
    +expData.nodes.slice(0,200).map(n=>'<tr class="rowlink" onclick="expGo(\''+n.id+'\')"><td>'+n.kind+'</td><td class="mono">'+n.id+'</td><td>'+esc(n.title||'')+'</td></tr>').join('')+'</tbody></table>';
  }else expRender();
}
function expSelect(id){
  expSel=id;const E=state.entities;
  const emp=E.employees.find(e=>e.id===id),acc=E.accounts.find(a=>a.id===id),tx=E.transactions.find(t=>t.id===id);
  let h='';
  if(emp)h='<b style="font-size:16px">'+id+'</b> '+esc(emp.name)+' <span class="note">Employee</span><dl class="kv"><dt>Department</dt><dd>'+esc(emp.dept)+'</dd><dt>Role</dt><dd>'+esc(emp.role)+'</dd><dt>Manager</dt><dd>'+esc(emp.manager||'—')+'</dd></dl>';
  else if(acc){const rel=E.transactions.filter(t=>t.src===id||t.dst===id);
    h='<b style="font-size:16px">'+id+'</b> '+esc(acc.label||'')+' <span class="note">Account</span><dl class="kv"><dt>Account</dt><dd>'+esc(acc.label||acc.customer)+'</dd><dt>Managed by</dt><dd>'+esc(acc.manager_emp||'—')+'</dd><dt>Balance</dt><dd>'+inr(acc.balance)+'</dd><dt>Transactions</dt><dd>'+rel.length+'</dd></dl>';}
  else if(tx)h='<b style="font-size:16px">'+id+'</b> <span class="note">Transaction</span> '+(tx.ground_truth_fraud?'<span class="bdg b-High">demo fraud label</span>':'')+'<dl class="kv"><dt>Route</dt><dd class="mono">'+tx.src+' → '+tx.dst+'</dd><dt>Amount</dt><dd>'+inr(tx.amount)+'</dd><dt>Time</dt><dd>'+fmtDate(tx.ts)+'</dd><dt>Type</dt><dd>'+tx.type+'</dd></dl>';
  const nb1=expData.edges.filter(e=>e.from===id||e.to===id).slice(0,12);
  h+='<h3 style="margin-top:10px">Relationships</h3>'+(nb1.length?nb1.map(e=>'<div class="stage"><div style="flex:1"><span class="mono">'+esc(e.from===id?e.to:e.from)+'</span> <span class="note">'+esc(e.label||'linked')+'</span></div></div>').join(''):'<div class="empty">None in view.</div>');
  const inAlert=state.alerts.find(a=>(a.tx_ids||[]).includes(id));
  h+='<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'
  +(inAlert?'<a class="btn pri" href="#/alertdetail/'+inAlert.id+'">View in Investigation</a>':'')
  +'<button class="btn" onclick="expExport()">Export Subgraph</button></div>';
  $('#xDetail').innerHTML=h;
  expConn();
}
function expConn(){
  if(!$('#xConn'))return;
  const rows=(expSel?expData.edges.filter(e=>e.from===expSel||e.to===expSel):expData.edges).slice(0,8);
  $('#xConn').innerHTML=rows.length?'<table class="t"><tbody>'+rows.map(e=>'<tr><td class="mono">'+esc(e.from)+' → '+esc(e.to)+'</td><td>'+esc(e.label||'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Select a node to see its connections.</div>';
}
/* ================= PAGE: Reports ================= */
async function vReports(){
  const v=$('#view');await ensureBase();
  v.innerHTML='<div class="phead"><div><h1 class="p">Reports</h1><p class="sub">Generate compliance-ready exports from any alert. JSON downloads the structured evidence; Print produces a formatted report.</p></div></div>'
  +'<div class="card"><label class="fl">Select alert</label><select id="rpSel">'+state.alerts.map(a=>'<option value="'+a.id+'">'+a.id+' — '+(DLABEL[a.detectors[0]]||'')+' ('+a.risk+')</option>').join('')+'</select> '
  +'<button class="btn pri" onclick="rpGen()">Generate</button> <button class="btn" onclick="window.print()">Print</button></div>'
  +'<div class="card" id="rpOut"><div class="empty">Choose an alert to preview its report.</div></div>';
}
async function rpGen(){
  const a=await detail($('#rpSel').value),ev=a.evidence;
  $('#rpOut').innerHTML='<h3>Investigation Report — '+a.id+'</h3><dl class="kv"><dt>Pattern</dt><dd>'+esc(a.detectors.map(d=>DLABEL[d]).join(' + '))+'</dd><dt>Risk</dt><dd>'+a.risk+' — '+esc(a.risk_reason||'')+'</dd><dt>Status</dt><dd>'+invStatus(a)+'</dd><dt>Assignee</dt><dd>'+esc(a.assignee||'—')+'</dd><dt>Amount</dt><dd>'+inr(alertAmount(a))+'</dd><dt>Narrative</dt><dd>'+esc(a.narrative||'')+'</dd></dl>'
  +'<h3>Timeline</h3><div class="tl">'+ev.timeline.map(e=>'<div><span class="ts">'+fmtDate(e.ts)+'</span> — '+esc(e.text)+'</div>').join('')+'</div>'
  +'<h3>Findings</h3><ol class="facts">'+(a.hits||[]).map(h=>'<li>'+esc(h.detail)+'</li>').join('')+'</ol>'
  +'<h3>Investigator notes</h3><p>'+esc(localStorage.getItem('fs_note_'+a.id)||'(none)')+'</p>'
  +'<div class="noprint" style="margin-top:10px"><button class="btn pri" onclick="window.open(\'/api/alerts/'+a.id+'/export\',\'_blank\')">Download JSON</button></div>';
}
/* ================= PAGE: Settings ================= */
async function vSettings(){
  const v=$('#view');await ensureBase();const m=state.metrics;
  v.innerHTML='<div class="phead"><div><h1 class="p">Settings</h1><p class="sub">System configuration and data management.</p></div></div>'
  +'<div class="card"><h3>Detection performance</h3><dl class="kv"><dt>Known-pattern accuracy</dt><dd>'+m.accuracy+'</dd><dt>False positive rate</dt><dd>'+m.false_positive_rate+'</dd><dt>Recall</dt><dd>'+m.recall+'</dd><dt>Stress test</dt><dd>'+(m.stress_test.scenarios?Math.round(m.stress_test.scenarios._overall.catch_rate*100)+'% caught ('+m.stress_test.scenarios._overall.caught_tx+'/'+m.stress_test.scenarios._overall.total_tx+')':'—')+'</dd><dt>Narrative source</dt><dd>'+esc((state.alerts.length&&state.details[state.alerts[0].id]||{}).narrative_source||'template-grounded')+'</dd></dl></div>'
  +'<div class="card"><h3>Detector thresholds (current)</h3><dl class="kv"><dt>Circular</dt><dd>cycles ≤ 5 nodes, 72h window (108h low tier), min leg ₹3,000</dd><dt>Structuring</dt><dd>≥ 3 sub-threshold parts, 48h window, ₹10,000 threshold</dd><dt>Access anomaly</dt><dd>escalation ≤ 72h high / ≤ 120h medium; grant ≤ 24h + ₹50,000</dd><dt>Hub shift</dt><dd>≥ 6 counterparties / 7d high; ≥ 8 / 10.5d medium</dd></dl><p class="note">Thresholds are versioned with the backend; changes require a code update and re-run of the stress test.</p></div>'
  +'<div class="card"><h3>Data</h3><p class="hint">Dataset: '+esc(m.dataset||'')+' — '+m.n_tx+' transactions, '+state.entities.employees.length+' employees, '+state.entities.accounts.length+' accounts.</p><button class="btn danger" onclick="if(confirm(\'Regenerate all demo data?\'))api(\'/api/bootstrap\',{method:\'POST\'}).then(()=>{state.alerts=[];state.details={};state.metrics=null;toast(\'Rebuilt.\');})">Rebuild demo data</button></div>'
  +'<div class="card"><h3>Methodology</h3><p class="hint">PaySim-calibrated synthetic transactions + synthetic HR/access layer (real PaySim CSV can be dropped into <span class="mono">data/</span>). Transparent graph rules, no black-box model — every alert carries its evidence subgraph.</p></div>';
}
/* ================= global search + notifications ================= */
function buildIndex(){
  const E=state.entities,idx=[];
  E.employees.forEach(e=>idx.push({t:'Employee',id:e.id,sub:e.name+' - '+e.dept+' · '+e.role,go:'#/explorer/'+e.id}));
  E.accounts.forEach(a=>idx.push({t:'Account',id:a.id,sub:(a.label||''),go:'#/explorer/'+a.id}));
  E.transactions.forEach(t=>idx.push({t:'Transaction',id:t.id,sub:t.src+' → '+t.dst+' '+inr(t.amount),go:'#/explorer/'+t.id}));
  state.alerts.forEach(a=>idx.push({t:'Alert',id:a.id,sub:(DLABEL[a.detectors[0]]||'')+' · '+a.risk,go:'#/alertdetail/'+a.id}));
  return idx;
}
let searchIdx=null;
async function gsearch(q){
  await ensureBase();if(!searchIdx)searchIdx=buildIndex();
  q=q.trim().toLowerCase();if(!q)return [];
  return searchIdx.filter(r=>(r.id+' '+r.sub).toLowerCase().includes(q)).slice(0,12);
}
function updateBell(){
  const n=state.alerts.filter(a=>a.status==='New').length;
  $('#bellN').textContent=n;$('#bellN').style.display=n?'block':'none';
}
function initChrome(){
  $('#gq').addEventListener('input',async e=>{
    const box=$('#sdrop'),rs=await gsearch(e.target.value);
    if(!rs.length){box.style.display='none';return;}
    box.innerHTML=rs.map((r,i)=>'<div class="r" data-i="'+i+'"><b>'+r.t+'</b><span class="mono">'+esc(r.id)+'</span><span class="note">'+esc(r.sub)+'</span></div>').join('');
    box.style.display='block';
    box.querySelectorAll('.r').forEach(el=>el.onclick=()=>{box.style.display='none';$('#gq').value='';location.hash=rs[+el.dataset.i].go;});
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sdrop').style.display='none';if(!e.target.closest('#bell')&&!e.target.closest('#ndrop'))$('#ndrop').style.display='none';});
  $('#bell').onclick=async()=>{
    await ensureBase();
    const news=state.alerts.filter(a=>a.status==='New').slice(0,8);
    const nd=$('#ndrop');
    nd.innerHTML=news.length?news.map(a=>'<div class="r" onclick="location.hash=\'#/alertdetail/'+a.id+'\';$(\'#ndrop\').style.display=\'none\'"><b>'+a.id+'</b> '+bdgRisk(a.risk)+'<br><span class="note">'+esc(DLABEL[a.detectors[0]]||'')+'</span></div>').join(''):'<div class="r">No new alerts.</div>';
    nd.style.display=nd.style.display==='block'?'none':'block';
  };
}
initChrome();nav();



</script>
